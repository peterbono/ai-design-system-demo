name: Bridge data

# Publishes the Bridge snapshot of the default branch to the orphan branch `bridge-data`: snapshot.json (the files
# the repo model reads, Figma coverage, contrast results) and audits/<id>.json (adoption audits of the apps that use
# the design system). Hosted Bridge Studio and Library read it from raw.githubusercontent.com, which costs visitors no
# GitHub API quota and works without signing in on a public repository. Same mechanics as `bridge-visual`
# (visual-impact.yml): an orphan branch written by github-actions[bot], never merged anywhere.
# Only the latest snapshot is on the branch tip; older ones stay in its history.
#
# Token: the GITHUB_TOKEN of this run only, with `contents: write` to push the bridge-data branch. No other secret.
# Other teams: copy templates/bridge-data.yml (runs the published CLI with npx).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One publish at a time; a newer push waits instead of racing on the branch.
  group: bridge-data
  cancel-in-progress: false

permissions:
  contents: write # push to the bridge-data branch, nothing else

env:
  DATA_BRANCH: bridge-data

jobs:
  snapshot:
    name: Publish the Bridge snapshot
    # A manual run from another branch would publish a snapshot that is not the default branch.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the bridge CLI
        run: npm run tokens:build && npm run mcp:build

      - name: Snapshot (repo model, Figma coverage, adoption audits)
        run: |
          node packages/cli/dist/index.js snapshot --out "$RUNNER_TEMP/bridge-data" \
            --audit-report apps/docs-site/src/data/audits \
            --audit "apps/admin/src=Bridge admin, main" \
            --audit "apps/docs-site/src=Bridge docs site, main" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish to the bridge-data branch
        env:
          OUT: ${{ runner.temp }}/bridge-data
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dir="$RUNNER_TEMP/bridge-data-branch"
          publish() {
            rm -rf "$dir"
            git worktree prune
            if git ls-remote --exit-code --heads origin "$DATA_BRANCH" > /dev/null; then
              git fetch -q --depth 1 origin "$DATA_BRANCH"
              git worktree add -q --detach "$dir" FETCH_HEAD
            else
              git worktree add -q --detach "$dir" HEAD
              git -C "$dir" checkout -q --orphan "$DATA_BRANCH"
            fi
            # The branch holds the latest snapshot only: replace everything.
            git -C "$dir" rm -rfq --ignore-unmatch .
            cp -R "$OUT/." "$dir/"
            printf '# bridge-data\n\nBridge snapshot of %s at %s, written by .github/workflows/bridge-data.yml.\nsnapshot.json is read by hosted Bridge Studio and Library; audits/ holds the adoption reports.\n' "$GITHUB_REPOSITORY" "${GITHUB_SHA:0:7}" > "$dir/README.md"
            git -C "$dir" add -A
            git -C "$dir" commit -qm "bridge data: ${GITHUB_SHA:0:7}" || { echo "Nothing new to publish"; return 0; }
            git -C "$dir" push -q origin "HEAD:refs/heads/$DATA_BRANCH"
          }
          for i in 1 2 3; do
            if publish; then exit 0; fi
            sleep $((i * 3))
          done
          exit 1
