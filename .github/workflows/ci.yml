name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build tokens (DTCG to CSS variables + TS)
        run: npm run tokens:build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint CSS (no raw colors or shadows in components)
        run: npm run lint:css

      - name: Build Storybook
        run: npm run build-storybook

  changeset:
    name: Changeset present
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Require a changeset when packages change
        run: npx changeset status --since=origin/${{ github.base_ref }}
